# Settings for the cup triangle experiment. Sorting keeps its own file, default.yaml.
# Cups are rigid and heavier than real paper cups, which is a simplification.
paths:
  g1_scene: third_party/mujoco_menagerie/unitree_g1/scene_with_hands.xml

scene:
  table:
    near_edge_x: 0.16
    depth: 0.55
    width: 0.90
    top_height: 0.72
  objects:
    cup_a: { shape: cup, size: [0.069, 0.069, 0.09], position: [0.33, -0.05], mass: 0.06, rgba: [0.92, 0.78, 0.15, 1] }
    cup_b: { shape: cup, size: [0.069, 0.069, 0.09], position: [0.33, -0.17], mass: 0.06, rgba: [0.20, 0.65, 0.25, 1] }
    cup_c: { shape: cup, size: [0.069, 0.069, 0.09], position: [0.33, -0.29], mass: 0.06, rgba: [0.80, 0.15, 0.15, 1] }
  containers: {}

motion:
  arm: right
  grip_height: 0.04
  hover_height: 0.22
  release_clearance: 0.006
  side_gap: 0.0
  hand_speed: 0.20
  finger_time: 0.5
  settle_time: 0.6
  control_rate_hz: 25
  finger_force_limit: 1.0
  hand_pitch: 0.20
  open_width: 0.10
  grip_squeeze: 0.015
  release_margin: 0.035
  home_position: [0.30, -0.10, 0.98]

triangle:
  center: [0.47, -0.13]
  cup_spacing: 0.085
  cup_height: 0.09
  rim_radius: 0.04
  top_radius: 0.028
  position_tolerance: 0.02
  max_tilt_degrees: 10.0
